name: Build release asset

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build
        required: true
        default: v1.0.7

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Build
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          swift build -c release -v 2>&1 | tee build.log

      - name: Publish build diagnostics
        if: steps.build.outcome == 'failure'
        run: |
          {
            echo "## Swift build diagnostics"
            tail -200 build.log
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Package app
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          APP_NAME="Lid Angle.app"
          APP_DIR="dist/$APP_NAME"
          mkdir -p "$APP_DIR/Contents/MacOS" "$APP_DIR/Contents/Resources"
          VERSION="${TAG#v}"
          BUILD_NUMBER="${VERSION##*.}"
          BINARY="$(find .build -path '*/release/LidAngleApp' -type f -print -quit)"
          cp "$BINARY" "$APP_DIR/Contents/MacOS/LidAngleApp"
          cp Resources/AppIcon.icns "$APP_DIR/Contents/Resources/AppIcon.icns"
          cp Resources/DoorCreak.wav "$APP_DIR/Contents/Resources/DoorCreak.wav"
          cat > "$APP_DIR/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDisplayName</key>
            <string>Lid Angle</string>
            <key>CFBundleExecutable</key>
            <string>LidAngleApp</string>
            <key>CFBundleIconFile</key>
            <string>AppIcon</string>
            <key>CFBundleIdentifier</key>
            <string>com.andrewcharlesmoss.lid-angle</string>
            <key>CFBundleName</key>
            <string>Lid Angle</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>$VERSION</string>
            <key>CFBundleVersion</key>
            <string>$BUILD_NUMBER</string>
            <key>LSMinimumSystemVersion</key>
            <string>14.0</string>
          </dict>
          </plist>
          PLIST
          codesign --force --deep --sign - "$APP_DIR"
          codesign --verify --deep --strict "$APP_DIR"
          ditto -c -k --sequesterRsrc --keepParent "$APP_DIR" "lid-angle-$TAG.zip"

      - name: Upload asset to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release upload "$TAG" "lid-angle-$TAG.zip" --repo "${{ github.repository }}" --clobber
