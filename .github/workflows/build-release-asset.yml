name: Build release asset

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build
        required: true
        default: v1.0.8

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Verify release source and tests
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          python3 scripts/verify-release.py --tag "$RELEASE_TAG"
          python3 -B -m unittest discover -s scripts/tests -p 'test_*.py'
          swift test

      - name: Build
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          swift build -c release -v 2>&1 | tee build.log

      - name: Publish build diagnostics
        if: steps.build.outcome == 'failure'
        run: |
          {
            echo "## Swift build diagnostics"
            tail -200 build.log
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Package and inspect app archive
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          bash scripts/package-app.sh "$GITHUB_WORKSPACE/dist"
          ditto -c -k --sequesterRsrc --keepParent "dist/Lid Angle.app" "lid-angle-$RELEASE_TAG.zip"
          python3 scripts/verify-release.py --tag "$RELEASE_TAG" --app "dist/Lid Angle.app" --archive "lid-angle-$RELEASE_TAG.zip"

      - name: Upload asset to release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: gh release upload "$RELEASE_TAG" "lid-angle-$RELEASE_TAG.zip" --repo "${{ github.repository }}"
